name: Windows

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          dotnet build build/Capri.App.csproj -c Release -o build/out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build build/Capri.Setup.csproj -c Release -o build/setup-out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Screen like a real PC
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "::warning::Could not set the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "::notice title=Screen::$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 15
        run: |
          $smoke = Join-Path $PWD "smoke"
          $run = Start-Process -FilePath build/out/Capri.exe -ArgumentList "--smoke-test", "`"$smoke`"" -PassThru -Wait
          $failed = $run.ExitCode -ne 0
          if (Test-Path "$smoke/smoke-test.txt") {
            $lines = Get-Content "$smoke/smoke-test.txt"
            $lines
            $passes = @($lines | Where-Object { $_ -like 'PASS*' }).Count
            Write-Host "::notice title=Smoke test::$passes PASS"
            foreach ($line in $lines | Where-Object { $_ -like 'FAIL*' }) { Write-Host "::error title=Smoke test::$line"; $failed = $true }
          } else { Write-Host "::error title=Smoke test::No smoke-test.txt"; $failed = $true }
          if (Test-Path "$smoke/failure.txt") {
            $crash = (Get-Content "$smoke/failure.txt" -Raw) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Smoke test crash::$crash"
            $failed = $true
          }
          if ($failed) { Write-Host "::error title=Smoke test::Capri exited with $($run.ExitCode)"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-windows
          path: |
            build/out/Capri.exe
            build/setup-out/Capri-Setup.exe

  release:
    # Publie une version quand main reçoit un numéro de version qui n'a pas encore de release.
    # Capri installée cherche ses mises à jour ici toutes les 3 heures (Updater.Repository).
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          full=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' app/AssemblyInfo.cs)
          version=${full%.0}
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.version.outputs.new == 'true'
        with:
          name: Capri-windows
          path: dist
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir release
          cp dist/setup-out/Capri-Setup.exe dist/out/Capri.exe release/
          (cd release && sha256sum Capri-Setup.exe Capri.exe > SHA256SUMS.txt)
          gh release create "${{ steps.version.outputs.tag }}" release/* --target "$GITHUB_SHA" --title "Capri ${{ steps.version.outputs.tag }}" --generate-notes
