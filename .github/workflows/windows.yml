name: Windows

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Screen like a real PC
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "::warning::Could not set the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "::notice title=Screen::$([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
      - name: Build and smoke test
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 300
      - name: Smoke test results
        if: always()
        shell: pwsh
        run: |
          $smoke = "out/windows/smoke/runtime"
          if (Test-Path "$smoke/smoke-test.txt") {
            $lines = Get-Content "$smoke/smoke-test.txt"
            $passes = @($lines | Where-Object { $_ -like 'PASS*' }).Count
            Write-Host "::notice title=Smoke test::$passes PASS"
            foreach ($line in $lines | Where-Object { $_ -like 'FAIL*' }) { Write-Host "::error title=Smoke test::$line" }
          } else { Write-Host "::error title=Smoke test::No smoke-test.txt" }
          foreach ($crash in @("$smoke/failure.txt", "out/windows/smoke/package/failure.txt")) {
            if (Test-Path $crash) { Write-Host "::error title=Smoke test crash::$((Get-Content $crash -Raw) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: out/windows/smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-windows
          path: |
            out/windows/Capri.exe
            out/windows/Capri-Setup.exe

  release:
    # Publie une version quand main reçoit un numéro de version qui n'a pas encore de release.
    # Capri installée cherche ses mises à jour ici toutes les 3 heures (Updater.Repository).
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          full=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' app/AssemblyInfo.cs)
          version=$(echo "$full" | cut -d. -f1-3)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v5
        if: steps.version.outputs.new == 'true'
        with:
          name: Capri-windows
          path: dist
      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir release
          cp dist/Capri-Setup.exe dist/Capri.exe release/
          (cd release && sha256sum Capri-Setup.exe Capri.exe > SHA256SUMS.txt)
          gh release create "${{ steps.version.outputs.tag }}" release/* --target "$GITHUB_SHA" --title "Capri ${{ steps.version.outputs.tag }}" --generate-notes
