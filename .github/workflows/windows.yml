name: Windows

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          dotnet build build/Capri.App.csproj -c Release -o build/out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build build/Capri.Setup.csproj -c Release -o build/setup-out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 15
        run: |
          $smoke = Join-Path $PWD "smoke"
          $run = Start-Process -FilePath build/out/Capri.exe -ArgumentList "--smoke-test", "`"$smoke`"" -PassThru -Wait
          $failed = $run.ExitCode -ne 0
          if (Test-Path "$smoke/smoke-test.txt") {
            $lines = Get-Content "$smoke/smoke-test.txt"
            $lines
            $passes = @($lines | Where-Object { $_ -like 'PASS*' }).Count
            Write-Host "::notice title=Smoke test::$passes PASS"
            foreach ($line in $lines | Where-Object { $_ -like 'FAIL*' }) { Write-Host "::error title=Smoke test::$line"; $failed = $true }
          } else { Write-Host "::error title=Smoke test::No smoke-test.txt"; $failed = $true }
          if (Test-Path "$smoke/failure.txt") {
            $crash = (Get-Content "$smoke/failure.txt" -Raw) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Smoke test crash::$crash"
            $failed = $true
          }
          if ($failed) { Write-Host "::error title=Smoke test::Capri exited with $($run.ExitCode)"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-windows
          path: |
            build/out/Capri.exe
            build/setup-out/Capri-Setup.exe
